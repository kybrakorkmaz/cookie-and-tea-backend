services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: cat_dev

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    command: npm run dev

  postgres:
    image: postgres:17-alpine

    container_name: cat_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgAdmin:
    image: dpage/pgadmin4
    container_name: cat_pgadmin
    ports:
      - "5050:80"
    env_file:
      - .env
    depends_on:
      - postgres
volumes:
  postgres_data: