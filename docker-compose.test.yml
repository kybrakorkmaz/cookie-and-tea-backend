version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: cat_test_api
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.test
    environment:
      - IN_DOCKER=1
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  postgres:
    image: postgres:17-alpine
    container_name: cat_test_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=strongdevpass123
      - POSTGRES_DB=cat_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      # do not mount init.sql for test compose to avoid init script failure if DB exists
      # - ./src/scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cat_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
