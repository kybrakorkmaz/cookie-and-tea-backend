services:
  app:
    extends:
      file: docker-compose.base.yml
      service: api-base
    build:
      target: production
    container_name: cat_prod
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "node", "src/server/health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
