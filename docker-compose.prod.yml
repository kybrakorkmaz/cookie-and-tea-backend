services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: cat-prod

    ports:
      - "8000:8000"

    env_file:
      - .env.production

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "src/server/health.js"]
      interval: 30s
      timeout: 5s
      retries: 3